[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "storyteller"
version = "0.1.0"
description = "Autonomous LLM-Powered Storytelling Agent for Power BI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "duckdb>=1.0.0",
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "openpyxl>=3.1.2",
    "pyarrow>=15.0.0",
    "jinja2>=3.1.3",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
storyteller = "storyteller.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
